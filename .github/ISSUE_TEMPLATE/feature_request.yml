name: 💡 Feature Request
description: Propose a new capability or architectural improvement.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: What limitation are you experiencing?
    validations:
      required: true
  - type: textarea
    id: proposed_solution
    attributes:
      label: Proposed Solution & Stack Impact
      description: Does this impact Next.js, Cloudflare, Python, or PHP services?
    validations:
      required: true
